[package]
name = "cvewatch-gui"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "cvewatch_gui"

[[bin]]
name = "cvewatch-gui"
path = "src/bin/cvewatch-gui.rs"

[dependencies]
chrono = "0.4.45"
cvewatch-core = { version = "0.1.0", path = "../core" }
cvewatch-frontend = { version = "0.1.0", path = "../frontend" }
eframe = { version = "0.37.0", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "wgpu", "glow"] }
egui_extras = "0.37.0"
rfd = "0.17.2"
tracing = "0.1.44"
zeroize = "1.9.1"

[dev-dependencies]
cvewatch-frontend = { version = "0.1.0", path = "../frontend", features = ["test-support"] }
egui_kittest = "0.37.0"
jsonschema = { version = "0.60.2", default-features = false }
rusqlite = "0.41.1"
serde_json = "1.0.154"
tempfile = "3.27.0"
wiremock = "0.6.5"
zip = { version = "9.4.1", default-features = false, features = ["deflate"] }
