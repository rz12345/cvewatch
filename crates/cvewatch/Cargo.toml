[package]
name = "cvewatch"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
cvewatch-core = { version = "0.1.0", path = "../core" }
indicatif = "0.18.6"
rpassword = "7.5.4"
rusqlite = "0.41.1"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "time", "net"] }
tracing = "0.1.44"
zeroize = "1.9.1"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"
