# cvewatch 內建產品目錄（種子）
#
# 欄位：
#   key              產品識別（小寫英數字與 -）
#   display_name     顯示名稱（自動視為別名）
#   vendor_display   廠商顯示名稱
#   version_scheme   版本格式：
#                      dotted   數字段＋尾碼              7.16.2、3.0.0-rc2、1.0.2a
#                      panos    PAN-OS                    11.1.4-h7
#                      dsm      Synology DSM              7.2.2-72806 Update 3
#                      esxi     VMware ESXi／vCenter      8.0 U3c、build 24414501
#                      ubuntu   Ubuntu                    22.04.4 LTS
#                      cisco    Cisco IOS／ASA／NX-OS     15.2(7)E8、9.18(4)22、10.2(3t)（同主次版本與 train 才可比較）
#                      junos    Juniper／Ivanti           21.4R3-S5、22.7R2.4
#                      numeric  數字分段（可有字母前綴）  7.0.1-5145、14.1-29.72、5.1.7.2770 build 20240520、R81.20
#                      zyxel    Zyxel 韌體                V2.80(ABCD.1)C0（同型號代碼才可比較）
#   advisory_source  原廠公告來源 id（對應 [[sources.csaf]]），選填
#   aliases          清冊中可能出現的寫法；比較前會 NFKC、小寫並移除空白與 -_./
#   cpe              NVD CPE 的 part / vendor / product
#   cna              CVE 5.x 記錄 affected[] 的 vendor / product 寫法
#   csaf             CSAF 公告 product_tree 的 vendor / product_name
#   keywords         英文描述關鍵字；CVE 沒有可辨識的 affected / CPE 時，描述含這些字詞即保留為「僅關鍵字相符」
#                    （不分大小寫、需為完整字詞；避免太短或太通用的字）
#
# 使用者可在 <data_dir>\catalog.d\*.toml 以相同格式擴充：
#   新 key → 新增產品；既有 key → 有寫的欄位覆寫、沒寫的沿用，aliases 合併。
#   例：為 ESXi 增加別名
#     [[product]]
#     key = "vmware-esxi"
#     aliases = ["r6515 esxi"]
#
# [[esxi_build]]：ESXi build 編號 → 版本名稱，讓清冊只填 build 的元件也能與 CVE 的 Update 名稱比較。
#   對照不到的 build 只能與其他 build 比較，判定結果為未知（不會誤判為不受影響）。
#   需人工維護：新版本以 Broadcom KB 316595「Build numbers and versions of VMware ESXi」核對後
#   在 catalog.d 補上（相同 build 以使用者檔為準）。

# ── 網路 / 資安 ─────────────────────────────────────────────

[[product]]
key = "paloalto-panos"
display_name = "PAN-OS"
vendor_display = "Palo Alto Networks"
version_scheme = "panos"          # 11.1.4-h7
advisory_source = "paloalto"
aliases = ["panos", "palo alto", "palo alto networks", "palo alto pan-os", "pa-460",
           "palo alto pa-460", "pa-series"]
cpe = [{ part = "o", vendor = "paloaltonetworks", product = "pan-os" }]
cna = [{ vendor = "Palo Alto Networks", product = "PAN-OS" }]
csaf = [{ vendor = "Palo Alto Networks", product = "PAN-OS" }]
keywords = ["PAN-OS"]

# 別名只寫廠牌＋產品／產品線名稱，不寫硬體型號：型號對應到韌體產品的別名、逐型號發布 CVE 的產品
# （例如 Zyxel 交換器韌體）請寫在 <data_dir>\catalog.d\*.toml（見使用說明）。

