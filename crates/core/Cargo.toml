[package]
name = "cvewatch-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
calamine = "0.38.0"
chrono = { version = "0.4.45", features = ["serde"] }
csv = "1.4.0"
data-encoding = "2.11.1"
directories = "6.0.0"
flate2 = "1.1.11"
keyring = "4.2.0"
lettre = { version = "0.11.23", default-features = false, features = ["smtp-transport", "builder", "hostname", "rustls", "aws-lc-rs", "rustls-platform-verifier"] }
packageurl = "0.7.1"
quick-xml = "0.42.0"
rand = "0.10.3"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls", "system-proxy", "http2", "charset"] }
rusqlite = { version = "0.41.1", features = ["bundled-sqlcipher-vendored-openssl"] }
rust_xlsxwriter = "0.102.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_ignored = "0.1.14"
serde_json = "1.0.154"
serde_path_to_error = "0.1.20"
sha2 = "0.11.1"
strsim = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["time"] }
toml = "1.2.1"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
unicode-normalization = "0.1.26"
url = "2.5.8"
zeroize = "1.9.1"
zip = { version = "9.4.1", default-features = false, features = ["deflate"] }
zstd = "0.14.3"

[dev-dependencies]
proptest = "1.12.0"
rcgen = "0.14.10"
rustls = "0.23.46"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "time"] }
wiremock = "0.6.5"
