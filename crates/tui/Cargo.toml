[package]
name = "cvewatch-tui"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
arboard = { version = "3.7.0", default-features = false }
chrono = "0.4.45"
cvewatch-core = { version = "0.1.0", path = "../core" }
open = "5.4.5"
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
rusqlite = "0.41.1"
toml_edit = "0.25.19"
tracing = "0.1.44"
tui-input = { version = "0.15.5", default-features = false }
unicode-width = "0.2.3"
zeroize = "1.9.1"

# tempfile、wiremock、zip 由 tests/support 引入的 core 測試建構器（crates/core/tests/common）使用
[dev-dependencies]
insta = "1.49.0"
jsonschema = { version = "0.60.2", default-features = false }
serde_json = "1.0.154"
tempfile = "3.27.0"
wiremock = "0.6.5"
zip = { version = "9.4.1", default-features = false, features = ["deflate"] }
